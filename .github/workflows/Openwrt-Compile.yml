name: Openwrt-Compile

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-26.04
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write

    steps:
    - name: Show system
      run: |
        echo -e "Total CPU cores\t: $(nproc)"
        cat /proc/cpuinfo | grep 'model name'

    - name: Maximize build space
      uses: smallprogram/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 4608
        root-reserve-mb: 3584
        remove-dotnet: "true"
        remove-android: "true"
        remove-haskell: "true"
        remove-codeql: "true"

    - name: Checkout
      uses: actions/checkout@main

    - name: Init build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        docker rmi -f $(docker images -q) 2>/dev/null || true
        [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
        sudo swapoff -a
        sudo rm -f /swapfile /mnt/swapfile
        sudo apt-get -y update
        sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
        sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2604-build-armbian-depends)
        sudo systemctl daemon-reload
        #sudo apt-get -y full-upgrade
        sudo apt-get -y autoremove --purge
        sudo apt-get clean
        sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
        sudo rm -rf ~/{.cargo,.dotnet,.rustup}
        sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
        sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
        sudo timedatectl set-ntp true
        date -u
        timedatectl status || true
        df -h

    - name: Prepare Mixedwrt
      run: |
        sudo chown -R runner:runner /home/runner/work/Actions
        cp -r ./SCRIPTS/. ./
        /bin/bash 01_get_ready.sh

    - name: Prepare Package
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        cp -r ../SCRIPTS/. ./
        /bin/bash 02_prepare_package.sh
        /bin/bash 02_target_only.sh
        /bin/bash 04_remove_upx.sh

    - name: QTMDFW4
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        cp -rf ../SEED/config.seed .config

    - name: Convert Translation
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        /bin/bash 03_convert_translation.sh

    - name: Add ACL
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        /bin/bash 05_create_acl_for_luci.sh -a

    - name: Fix Permissions
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        sudo -E chmod -R 755 ./08_fix_permissions.sh
        /bin/bash 08_fix_permissions.sh

    - name: Make Config
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        make defconfig

    - name: Get Architecture
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        TARGET_DEVICE_ARCH="$(grep "^CONFIG_TARGET_.*_.*=y$" ".config" | head -n 1 | sed 's/^CONFIG_TARGET_//g' | awk -F '_' '{print $1}')"
        echo "TARGET_DEVICE_ARCH=${TARGET_DEVICE_ARCH}-3328" >>$GITHUB_ENV
        latest_release="$(curl -s https://github.com/openwrt/openwrt/tags | grep -Eo "v[0-9\.]+\-*r*c*[0-9]*.tar.gz" | sed -n '/[2-9][5-9]/p' | sed -n 1p | sed 's/.tar.gz//g' | sed 's/v//g')"
        echo "latest_release=${latest_release}" >>$GITHUB_ENV

    #- name: Cache
      #uses: HiGarfield/cachewrtbuild@main
      #with:
        #mixkey: ${{ env.TARGET_DEVICE_ARCH }}
        #prefix: ${{ github.workspace }}/openwrt

    - name: Make Download
      working-directory: ${{ github.workspace }}/openwrt
      run: |
        make download -j50
        make -j$(($(nproc) + 1))

    - name: Compile Openwrt
      working-directory: ${{ github.workspace }}/openwrt
      id: compileopenwrt
      continue-on-error: true
      run: |
        IGNORE_ERRORS=1 make -j$(($(nproc) + 1))
        echo $?

    - name: If Error
      working-directory: ${{ github.workspace }}/openwrt
      if: steps.compileopenwrt.outcome == 'failure'
      run: |
        cat ./.config
        echo '================================================================'
        make -j1 V=s

    - name: Organize files
      id: organize
      run: |
        rm -rf ./artifact/
        mkdir -p ./artifact/
        mv openwrt/bin/targets/x86/64/*combined-efi.img* ./artifact/
        mv openwrt/bin/targets/x86/64/*rootfs.tar.gz* ./artifact/
        cd ./artifact/
        ls -Ahl
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: X86-OpenWrt-Artifact
        path: ./artifact/    

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        files: ./artifact/*
        tag_name: X86-OpenWrt-${{ env.latest_release }}
        name: X86-OpenWrt-${{ env.latest_release }}
        body: Auto-generated release for OpenWrt build.

    - name: Print Disk Space After
      run: df -h
